function addRoundRow(){const d=document.createElement('div');d.className='round-row';d.innerHTML=`<button class="remove-round">刪除</button><div class="round-title">陀螺對戰 ${$('#roundRows').children.length+1}</div><div class="round-grid"><div><select class="mine-preset">${mineOptions}</select><input class="mine-custom custom-bey" placeholder="自訂我方陀螺"></div><div><select class="op-preset">${opOptions}</select><input class="op-custom custom-bey" placeholder="自訂對手陀螺"></div><div><select class="bit-preset" style="display:none"><option value="__custom"></option></select><input class="bit-custom" placeholder="對手軸心（自行輸入）"></div><select class="round-score"><option value="">本回合分數</option><option value="1">我方 +1</option><option value="2">我方 +2</option><option value="3">我方 +3</option><option value="-1">我方 -1</option><option value="-2">我方 -2</option><option value="-3">我方 -3</option></select><select class="round-reason">${reasonOptions}</select><input class="round-note" placeholder="備註（可不填）"></div>`;$('#roundRows').appendChild(d)}
function chosen(row,prefix){const s=row.querySelector('.'+prefix+'-preset'),c=row.querySelector('.'+prefix+'-custom');return s.value==='__custom'?c.value.trim():s.value}function collectRows(){return $$('.round-row').map(r=>({mine:chosen(r,'mine'),opponent:chosen(r,'op'),opponentBit:r.querySelector('.bit-custom').value.trim(),score:+r.querySelector('.round-score').value,reason:r.querySelector('.round-reason').value,note:r.querySelector('.round-note').value.trim()})).filter(x=>x.mine||x.opponent||x.score)}function updateBoard(){const rows=collectRows(),my=rows.filter(x=>x.score>0).reduce((s,x)=>s+x.score,0),op=rows.filter(x=>x.score<0).reduce((s,x)=>s+Math.abs(x.score),0);$('#myTotal').textContent=my;$('#opTotal').textContent=op}function clearMatch(){editingId='';$('#finishMatch').textContent='一次儲存完整對戰';$('#roundRows').innerHTML='';for(let i=0;i<3;i++)addRoundRow();updateBoard()}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active');if(b.dataset.page==='stats')renderStats();if(b.dataset.page==='history')renderHistory()});$('#players').onclick=e=>{if(!e.target.dataset.v)return;player=e.target.dataset.v;$('#players .active')?.classList.remove('active');e.target.classList.add('active')};$('#roundRows').onchange=e=>{if(e.target.matches('.mine-preset,.op-preset,.bit-preset'))e.target.nextElementSibling.style.display=e.target.value==='__custom'?'block':'none';updateBoard()};$('#roundRows').onclick=e=>{if(e.target.classList.contains('remove-round')){e.target.closest('.round-row').remove();updateBoard()}};$('#addRound').onclick=addRoundRow;
$('#finishMatch').onclick=()=>{const venue=$('#venue').value.trim(),bracket=$('#bracketType').value,round=$('#roundNumber').value,matchRound=bracket&&round?`${bracket}第${round}輪`:'',rows=collectRows();if(!venue||!matchRound||!rows.length)return toast('請填賽事、輪次與本場明細');if(rows.some(x=>!x.mine||!x.opponent||!x.score))return toast('每列都要選雙方陀螺與分數');const my=rows.filter(x=>x.score>0).reduce((s,x)=>s+x.score,0),op=rows.filter(x=>x.score<0).reduce((s,x)=>s+Math.abs(x.score),0);if(my<4&&op<4&&!confirm(`目前比分 ${my}：${op}，尚未到4分，仍要儲存嗎？`))return;const wasEditing=editingId,id=wasEditing||('m'+Date.now()),base={matchId:id,date:$('#date').value,player,venue,matchRound,participants:+$('#participants').value||'',fee:+$('#fee').value||'',eventResult:$('#eventResult').value.trim()};if(wasEditing)records=records.filter(x=>matchId(x)!==wasEditing);rows.forEach((x,i)=>records.push({...base,...x,id:id+'-'+i}));saveAll();clearMatch();toast(`${wasEditing?'修改':'完整對戰'}已儲存：${my}：${op}`)};$('#newMatch').onclick=()=>{if(collectRows().length&&!confirm('確定清除尚未儲存的本場明細？'))return;clearMatch();toast('已清除本場明細')};
$('#newEvent').onclick=()=>{const hasDraft=$('#venue').value.trim()||$('#fee').value||$('#participants').value||$('#eventResult').value.trim()||$('#roundNumber').value||collectRows().length;if(hasDraft&&!confirm('開始新賽事會清空目前尚未儲存的填寫內容，確定繼續嗎？'))return;clearMatch();$('#date').value=new Date().toISOString().slice(0,10);$('#venue').value='';$('#fee').value='';$('#participants').value='';$('#eventResult').value='';$('#bracketType').value='正賽';$('#roundNumber').value='';toast('已準備開始新賽事')};
function group(ms,key){const o={};ms.filter(m=>m.result==='勝'||m.result==='敗').forEach(m=>{const k=m[key]||'未填';o[k]??={name:k,w:0,l:0,g:0};m.result==='勝'?o[k].w++:o[k].l++;o[k].g++});return Object.values(o).map(x=>({...x,rate:x.w/x.g})).sort((a,b)=>b.rate-a.rate||b.g-a.g)}function bars(id,data){$(id).innerHTML=data.length?data.map(x=>`<div class="barline"><span>${x.name}</span><div class="bar"><i style="width:${Math.round(x.rate*100)}%"></i></div><b>${Math.round(x.rate*100)}%</b></div><div class="meta" style="margin:-6px 0 8px 88px">${x.w}勝 ${x.l}敗・${x.g}場</div>`).join(''):'<div class="empty">尚無資料</div>'}
function pointStats(rows){const o={};rows.forEach(x=>{const k=x.mine||'未填';o[k]??={name:k,for:0,against:0,rounds:0};x.score>0?o[k].for+=x.score:o[k].against+=Math.abs(x.score);o[k].rounds++});return Object.values(o).map(x=>({...x,net:x.for-x.against})).sort((a,b)=>b.net-a.net||b.for-a.for)}function pointBars(id,data){$(id).innerHTML=data.length?data.map(x=>`<div class="barline"><span>${x.name}</span><div class="bar"><i style="width:${Math.min(100,x.for/Math.max(1,x.for+x.against)*100)}%"></i></div><b>${x.net>=0?'+':''}${x.net}</b></div><div class="meta" style="margin:-6px 0 8px 88px">得分 ${x.for}・失分 ${x.against}・${x.rounds}回合</div>`).join(''):'<div class="empty">尚無資料</div>'}
function countTop(rows,key){const c={};rows.forEach(x=>c[x[key]||'未填']=(c[x[key]||'未填']||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]}
function topTies(rows,key){const c={};rows.forEach(x=>{const v=x[key];if(v)c[v]=(c[v]||0)+1});const max=Math.max(0,...Object.values(c));return {names:Object.entries(c).filter(([,n])=>n===max).map(([name])=>name),count:max}}
function lossDetail(rows){const reason=countTop(rows,'reason');if(!reason)return null;const counts={};rows.filter(x=>(x.reason||'未填')===reason[0]).forEach(x=>counts[x.mine||'未填']=(counts[x.mine||'未填']||0)+1);const max=Math.max(...Object.values(counts)),beys=Object.entries(counts).filter(([,n])=>n===max).map(([name])=>name);return {reason:reason[0],count:reason[1],beys,beyCount:max}}
function bestEvent(ms,who){const e={},rank=t=>{if(/冠軍|第一/.test(t))return 1;if(/亞軍|第二/.test(t))return 2;if(/季軍|第三/.test(t))return 3;if(/殿軍|第四/.test(t))return 4;return +(t.match(/\d+/)||[999])[0]};ms.filter(m=>m.player===who&&m.eventResult).forEach(m=>e[m.date+'|'+m.venue]={name:m.venue,result:m.eventResult,date:m.date,rank:rank(m.eventResult)});return Object.values(e).sort((a,b)=>a.rank-b.rank)[0]}
function renderStats(){const ms=matches(),done=ms.filter(m=>['勝','敗'].includes(m.result)),p=group(done,'player'),eg=bestEvent(ms,'高高'),er=bestEvent(ms,'RED'),gRows=records.filter(x=>x.player==='高高'),rRows=records.filter(x=>x.player==='RED'),gLoss=gRows.filter(x=>x.score<0),rLoss=rRows.filter(x=>x.score<0),ng=countTop(gLoss.filter(x=>x.opponent),'opponent'),nr=countTop(rLoss.filter(x=>x.opponent),'opponent'),lg=lossDetail(gLoss),lr=lossDetail(rLoss),enough=x=>x&&x[1]>=3,enoughReason=x=>x&&x.count>=3;$('#nemesisG').textContent=enough(ng)?ng[0]:'—';$('#nemesisGS').textContent=enough(ng)?`${ng[1]} 個失分回合`:'資料不足（至少3次）';$('#nemesisR').textContent=enough(nr)?nr[0]:'—';$('#nemesisRS').textContent=enough(nr)?`${nr[1]} 個失分回合`:'資料不足（至少3次）';$('#lossReasonG').textContent=enoughReason(lg)?lg.reason:'—';$('#lossReasonGS').textContent=enoughReason(lg)?`${lg.count}次・${lg.beys.length>1?'':'最常發生在 '}${lg.beys.join('、')}（各${lg.beyCount}次）`:'資料不足（至少3次）';$('#lossReasonR').textContent=enoughReason(lr)?lr.reason:'—';$('#lossReasonRS').textContent=enoughReason(lr)?`${lr.count}次・${lr.beys.length>1?'':'最常發生在 '}${lr.beys.join('、')}（各${lr.beyCount}次）`:'資料不足（至少3次）';$('#bestResultG').textContent=eg?.result||'—';$('#bestResultGS').textContent=eg?`${eg.venue}・${eg.date}`:'尚未填寫';$('#bestResultR').textContent=er?.result||'—';$('#bestResultRS').textContent=er?`${er.venue}・${er.date}`:'尚未填寫';bars('#playerBars',p);pointBars('#gaoBars',pointStats(gRows));pointBars('#redBars',pointStats(rRows))}
function setRowValue(row,prefix,value){const s=row.querySelector('.'+prefix+'-preset'),c=row.querySelector('.'+prefix+'-custom');if(!value){s.value='';return}if([...s.options].some(o=>o.value===value))s.value=value;else{s.value='__custom';c.value=value;c.style.display='block'}}function editMatch(id){const m=matches().find(x=>x.id===id);if(!m)return;clearMatch();editingId=id;$('#finishMatch').textContent='儲存修改';$('#date').value=m.date;$('#venue').value=m.venue;$('#fee').value=m.fee||'';$('#participants').value=m.participants||'';$('#eventResult').value=m.eventResult||'';const rm=(m.matchRound||'').match(/^(正賽|敗部)第(\d+)輪$/);$('#bracketType').value=rm?.[1]||'';$('#roundNumber').value=rm?.[2]||'';player=m.player;$('#players .active')?.classList.remove('active');$(`#players [data-v="${player}"]`).classList.add('active');$('#roundRows').innerHTML='';m.rounds.forEach(x=>{addRoundRow();const row=$('.round-row:last-child');setRowValue(row,'mine',x.mine);setRowValue(row,'op',x.opponent);setRowValue(row,'bit',x.opponentBit);row.querySelector('.round-score').value=x.score;row.querySelector('.round-reason').value=x.reason||'';row.querySelector('.round-note').value=x.note||''});updateBoard();$('[data-page="record"]').click();toast('已載入，修改後按「儲存修改」')}function deleteMatch(id){const m=matches().find(x=>x.id===id);if(!m||!confirm(`確定刪除「${m.venue}｜${m.matchRound||'此場'}」？`))return;records=records.filter(x=>matchId(x)!==id);saveAll();renderHistory();toast('已刪除這場紀錄')}
function renderHistory(){const p=$('#filterPlayer').value,v=$('#filterVenue').value.trim(),ms=matches().filter(m=>(!p||m.player===p)&&(!v||m.venue.includes(v)));$('#logs').innerHTML=ms.length?ms.map(m=>`<div class="match"><div class="match-head"><div class="avatar ${m.player==='RED'?'red':''}">${m.player==='RED'?'R':'高'}</div><div><b>${m.venue}｜${m.matchRound||'輪次未填'}</b><div class="meta">${m.date}・${m.player}・${m.result}${m.participants?'・'+m.participants+'人賽':''}${m.eventResult?'・最終成績 '+m.eventResult:''}${m.fee?'・$'+m.fee:''}</div></div><div class="points ${m.result==='勝'?'win':''}">${m.my}：${m.op}</div></div><div class="rounds">${m.rounds.map((x,i)=>`${i+1}. ${x.mine}${x.opponent?' vs '+x.opponent+(x.opponentBit?'（'+x.opponentBit+'）':''):''}｜${x.score>0?'得 '+x.score:'失 '+Math.abs(x.score)} 分｜${x.reason||'未填原因'}${x.note?'｜'+x.note:''}`).join('<br>')}</div><div class="match-actions"><button data-edit="${m.id}">修改</button><button class="delete" data-delete="${m.id}">刪除</button></div></div>`).join(''):'<div class="empty">沒有符合條件的對戰</div>'}
$('#logs').onclick=e=>{if(e.target.dataset.edit)editMatch(e.target.dataset.edit);if(e.target.dataset.delete)deleteMatch(e.target.dataset.delete)};$('#filterPlayer').onchange=renderHistory;$('#filterVenue').oninput=renderHistory;$('#resetBtn').onclick=()=>{if(confirm('確定清除全部紀錄？')){records=[];clearMatch();saveAll();renderHistory()}};$('#exportBtn').onclick=()=>{const a=document.createElement('a'),b=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='陀螺比賽紀錄.json';a.click();URL.revokeObjectURL(a.href)};clearMatch();updateCount('連線中');loadShared(true);setInterval(()=>loadShared(false),10000);
